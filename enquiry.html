<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brown's Bakery | Enquiry</title>
</head>

<body>

    <!-- Header and navigation -->
    <header>
        <h1>Brown's Bakery</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="products.html">Products</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Main content -->
    <main>

        <!-- Enquiry introduction -->
        <section>
            <h2>Make an Enquiry</h2>

            <p>
                Have a question about a custom cake, catering or a special order?
                Complete the form below and we will get back to you.
            </p>
        </section>

        <!-- Enquiry form -->
        <section>
            <form>

                <p>
                    <label for="name">Full Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="phone">Phone Number:</label><br>
                    <input type="tel" id="phone" name="phone">
                </p>

                <p>
                    <label for="enquiry-type">Type of Enquiry:</label><br>

                    <select id="enquiry-type" name="enquiry-type" required>
                        <option value="">Select an option</option>
                        <option value="custom-cake">Custom Cake</option>
                        <option value="catering">Catering</option>
                        <option value="special-order">Special Order</option>
                        <option value="other">Other</option>
                    </select>
                </p>

                <p>
                    <label for="message">Your Enquiry:</label><br>

                    <textarea id="message"
                              name="message"
                              rows="6"
                              cols="40"
                              required></textarea>
                </p>

                <button type="submit">Submit Enquiry</button>

            </form>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Brown's Bakery. All rights reserved.</p>
    </footer>

</body>

</html>
